
nc: 10
end2end: True
reg_max: 1

scales:
  # [depth_multiple, width_multiple, max_channels]
  s: [0.50, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0  P1 320x320
  - [-1, 1, Conv, [128, 3, 2]]              # 1  P2 160x160
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2  backbone P2
  - [-1, 1, Conv, [256, 3, 2]]              # 3  P3 80x80
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4  backbone P3
  - [-1, 1, Conv, [512, 3, 2]]              # 5  P4 40x40
  - [-1, 2, C3k2, [512, True]]              # 6  backbone P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 7  P5 20x20
  - [-1, 2, C3k2, [1024, True]]             # 8
  - [-1, 1, NSSA, [2, 8]]                  # 9  NSSA
  - [-1, 1, SPPF, [1024, 5, 3, True]]       # 10
  - [-1, 2, C2PSA, [1024]]                  # 11

head:
  # BIMA: six CBS containers
  - [2,  1, Conv, [128, 1, 1]]              # 12  CBS-P2  160x160
  - [4,  1, Conv, [128, 1, 1]]              # 13  CBS-P3   80x80
  - [6,  1, Conv, [128, 1, 1]]              # 14  CBS-P4   40x40
  - [11, 1, Conv, [128, 1, 1]]              # 15  CBS-P5   20x20  (deep semantic anchor)
  - [4,  1, Conv, [128, 1, 1]]              # 16  CBS-P3 second tap (80x80)
  - [6,  1, Conv, [128, 1, 1]]              # 17  CBS-P4 second tap (40x40)

  # BIMA: top-down path
  - [11, 1, nn.Upsample, [None, 2, 'nearest']]  # 18
  - [[18, 6], 1, Concat, [1]]                   # 19
  - [-1, 2, C3k2, [512, True]]                  # 20
  - [-1, 1, Conv, [128, 1, 1]]                  # 21
  - [[14, 17, 21, 15], 1, BIMA_TD_P4, [128]]    # 22 P4

  - [22, 1, nn.Upsample, [None, 2, 'nearest']]  # 23
  - [[23, 4], 1, Concat, [1]]                   # 24
  - [-1, 2, C3k2, [256, True]]                  # 25
  - [-1, 1, Conv, [128, 1, 1]]                  # 26
  - [[13, 16, 26, 15], 1, BIMA_TD_P3, [128]]    # 27 P3

  - [27, 1, nn.Upsample, [None, 2, 'nearest']]  # 28
  - [[28, 2], 1, Concat, [1]]                   # 29
  - [-1, 2, C3k2, [256, False, 0.25]]           # 30
  - [[12, 30, 27, 15], 1, BIMA_TD_P2, [128]]    # 31 P2

  # BIMA: bottom-up path
  - [31, 1, Conv, [128, 3, 2]]                  # 32 downsample P2
  - [[32, 27], 1, Concat, [1]]                  # 33
  - [-1, 2, C3k2, [256, True]]                  # 34
  - [-1, 1, Conv, [128, 1, 1]]                  # 35
  - [[31, 35, 22, 15], 1, BIMA_BU_P3, [128]]    # 36 P3

  - [36, 1, Conv, [128, 3, 2]]                  # 37 downsample P3
  - [[37, 22], 1, Concat, [1]]                  # 38
  - [-1, 2, C3k2, [512, True]]                  # 39
  - [-1, 1, Conv, [128, 1, 1]]                  # 40
  - [[31, 36, 40, 15], 1, BIMA_BU_P4, [128]]    # 41 P4

  # CSFA: adaptive fusion over the three final BIMA outputs
  - [[31, 36, 41], 1, CSFA_TD_P2, []]           # 42 fused P2
  - [[31, 36, 41], 1, CSFA_TD_P3, []]           # 43 fused P3
  - [[31, 36, 41], 1, CSFA_TD_P4, []]           # 44 fused P4

  # Detection head
  - [[42, 43, 44], 1, Detect, [nc]]             # 45
