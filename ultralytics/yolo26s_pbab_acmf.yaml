
nc: 10
end2end: True
reg_max: 1

scales:
  # [depth_multiple, width_multiple, max_channels]
  s: [0.50, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0  P1 320x320
  - [-1, 1, Conv, [128, 3, 2]]              # 1  P2 160x160
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2  backbone P2
  - [-1, 1, Conv, [256, 3, 2]]              # 3  P3 80x80
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4  backbone P3
  - [-1, 1, Conv, [512, 3, 2]]              # 5  P4 40x40
  - [-1, 2, C3k2, [512, True]]              # 6  backbone P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 7  P5 20x20
  - [-1, 2, C3k2, [1024, True]]             # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]       # 9  official YOLO26-style SPPF args
  - [-1, 2, C2PSA, [1024]]                  # 10

head:
  # BIMA: six CBS containers
  - [2, 1, Conv, [128, 1, 1]]               # 11 CBS-P2
  - [4, 1, Conv, [128, 1, 1]]               # 12 CBS-P3
  - [6, 1, Conv, [128, 1, 1]]               # 13 CBS-P4
  - [10, 1, Conv, [128, 1, 1]]              # 14 CBS-P5
  - [4, 1, Conv, [128, 1, 1]]               # 15 CBS-P3 second tap
  - [6, 1, Conv, [128, 1, 1]]               # 16 CBS-P4 second tap

  # BIMA: top-down path
  - [10, 1, nn.Upsample, [None, 2, 'nearest']]  # 17
  - [[17, 6], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [512, True]]                  # 19
  - [-1, 1, Conv, [128, 1, 1]]                  # 20
  - [[13, 16, 20, 14], 1, BIMA_TD_P4, [128]]    # 21 P4

  - [21, 1, nn.Upsample, [None, 2, 'nearest']]  # 22
  - [[22, 4], 1, Concat, [1]]                   # 23
  - [-1, 2, C3k2, [256, True]]                  # 24
  - [-1, 1, Conv, [128, 1, 1]]                  # 25
  - [[12, 15, 25, 14], 1, BIMA_TD_P3, [128]]    # 26 P3

  - [26, 1, nn.Upsample, [None, 2, 'nearest']]  # 27
  - [[27, 2], 1, Concat, [1]]                   # 28
  - [-1, 2, C3k2, [256, False, 0.25]]           # 29
  - [[11, 29, 26, 14], 1, BIMA_TD_P2, [128]]    # 30 P2

  # BIMA: bottom-up path
  - [30, 1, Conv, [128, 3, 2]]                  # 31 downsample P2
  - [[31, 26], 1, Concat, [1]]                  # 32
  - [-1, 2, C3k2, [256, True]]                  # 33
  - [-1, 1, Conv, [128, 1, 1]]                  # 34
  - [[30, 34, 21, 14], 1, BIMA_BU_P3, [128]]    # 35 P3

  - [35, 1, Conv, [128, 3, 2]]                  # 36 downsample P3
  - [[36, 21], 1, Concat, [1]]                  # 37
  - [-1, 2, C3k2, [512, True]]                  # 38
  - [-1, 1, Conv, [128, 1, 1]]                  # 39
  - [[30, 35, 39, 14], 1, BIMA_BU_P4, [128]]    # 40 P4

  # CSFA: adaptive fusion over the three final BIMA outputs
  - [[30, 35, 40], 1, CSFA_TD_P2, []]           # 41 fused P2
  - [[30, 35, 40], 1, CSFA_TD_P3, []]           # 42 fused P3
  - [[30, 35, 40], 1, CSFA_TD_P4, []]           # 43 fused P4

  # Detection head
  - [[41, 42, 43], 1, Detect, [nc]]             # 44
