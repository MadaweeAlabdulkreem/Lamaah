# Ultralytics YOLO26 + BIMA (P2–P4 only)
# yolo26s_bima.yaml

nc: 10
end2end: True
reg_max: 1

# Backbone : YOLO26n  (Conv + C3k2 + SPPF + C2PSA)
# Neck     : BIMA-FPN (6 CBS containers, 3 top-down SDF + 3 bottom-up SDF)
# Head     : P2(160x160), P3(80x80), P4(40x40)  [P5 removed per paper]

scales:
  # depth_multiple, width_multiple, max_channels
 s: [0.50, 0.50, 1024] # summary: 260 layers, 10,009,784 parameters, 10,009,784 gradients, 22.8 GFLOPs

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]]              # 0  P1 320x320
  - [-1, 1, Conv,  [128, 3, 2]]             # 1  P2 160x160
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2  P2 160x160  <- CBS tap
  - [-1, 1, Conv,  [256, 3, 2]]             # 3  P3 80x80
  - [-1, 2, C3k2,  [512, False, 0.25]]      # 4  P3 80x80    <- CBS tap
  - [-1, 1, Conv,  [512, 3, 2]]             # 5  P4 40x40
  - [-1, 2, C3k2,  [512, True]]             # 6  P4 40x40    <- CBS tap
  - [-1, 1, Conv,  [1024, 3, 2]]            # 7  P5 20x20
  - [-1, 2, C3k2,  [1024, True]]            # 8  P5 20x20
  - [-1, 1, SPPF,  [1024, 5]]              # 9  SPPF 20x20
  - [-1, 2, C2PSA, [1024]]                  # 10 C2PSA 20x20 <- CBS tap (SPPF-equiv)

head:
  # ── Six CBS containers (kernel=1, stride=1) ──────────────────────────────
  # Tap backbone feature maps and store them as auxiliary input streams
  # for all SDF nodes (paper: 'containers to store backbone feature info')
  - [2,  1, Conv, [128, 1, 1]]              # 11  CBS-P2  160x160
  - [4,  1, Conv, [128, 1, 1]]              # 12  CBS-P3   80x80
  - [6,  1, Conv, [128, 1, 1]]              # 13  CBS-P4   40x40
  - [10, 1, Conv, [128, 1, 1]]              # 14  CBS-P5   20x20
  - [4, 1, Conv, [128, 1, 1]]              # 15  CBS-P3 second tap
  - [6, 1, Conv, [128, 1, 1]]              # 16  CBS-P4 second tap

  # ── Top-down path ────────────────────────────────────────────────────────
  # SDF @ P4 (40x40): upsample C2PSA -> fuse P4 -> C3k2 -> CBS -> SDF
  - [10, 1, nn.Upsample, [None, 2, 'nearest']]  # 17
  - [[17, 6], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [512, True]]                  # 19  C3k2 (YOLO26 style)
  - [-1, 1, Conv, [128, 1, 1]]                  # 20  CBS
  - [[13, 16, 20, 14], 1, BIMA_TD_P4, [128]]    # 21  SDF_TD @ P4 (40x40)

  # SDF @ P3 (80x80): upsample SDF_P4 -> fuse P3 -> C3k2 -> CBS -> SDF
  - [21, 1, nn.Upsample, [None, 2, 'nearest']]  # 22
  - [[22, 4], 1, Concat, [1]]                   # 23
  - [-1, 2, C3k2, [256, True]]                  # 24
  - [-1, 1, Conv, [128, 1, 1]]                  # 25  CBS
  - [[12, 15, 25, 14], 1, BIMA_TD_P3, [128]]    # 26  SDF_TD @ P3 (80x80)

  # SDF @ P2 (160x160): upsample SDF_P3 -> fuse P2 -> C3k2 -> SDF
  - [26, 1, nn.Upsample, [None, 2, 'nearest']]  # 27
  - [[27, 2], 1, Concat, [1]]                   # 28
  - [-1, 2, C3k2, [256, False, 0.25]]            # 29
  - [[11, 29, 26, 14], 1, BIMA_TD_P2, [128]]    # 30  SDF_TD @ P2 (160x160) -> CSFA-Head4

  # ── Bottom-up path ───────────────────────────────────────────────────────
  # SDF BU @ P3 (80x80): downsample SDF_P2 -> fuse SDF_P3 -> C3k2 -> CBS -> SDF
  - [30, 1, Conv, [128, 3, 2]]                  # 31  CBS stride=2 downsample
  - [[31, 26], 1, Concat, [1]]                  # 32
  - [-1, 2, C3k2, [256, True]]                  # 33
  - [-1, 1, Conv, [128, 1, 1]]                  # 34  CBS
  - [[30, 34, 21, 14], 1, BIMA_BU_P3, [128]]    # 35  SDF_BU @ P3 (80x80)  -> CSFA-Head3

  # SDF BU @ P4 (40x40): downsample SDF_BU_P3 -> fuse SDF_P4 -> C3k2 -> CBS -> SDF
  - [35, 1, Conv, [128, 3, 2]]                  # 36  CBS stride=2 downsample
  - [[36, 21], 1, Concat, [1]]                  # 37
  - [-1, 2, C3k2, [512, True]]                  # 38
  - [-1, 1, Conv, [128, 1, 1]]                  # 39  CBS
  - [[30, 35, 39, 14], 1, BIMA_BU_P4, [128]]    # 40  SDF_BU @ P4 (40x40)  -> CSFA-Head2

  # ── Detection: P2(160x160), P3(80x80), P4(40x40) ────────────────────────
  - [[30, 35, 40], 1, Detect, [nc]]
